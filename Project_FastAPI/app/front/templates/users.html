<!DOCTYPE html>
<html>
<head>
    <title>Список пользователей</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Список пользователей</h1>
    <ul>
        {% for user in users %}
            <li>
                <a href="/users/{{ user.id }}/notes_page">{{ user.username }}</a>
            </li>
        {% endfor %}
    </ul>
    <a href="/register-form">Создать нового пользователя</a>
</body>
</html>
